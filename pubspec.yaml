name: sclip
description: "Offline, RAM-only clipboard manager for macOS and Windows."
publish_to: 'none'
version: 1.1.0+1

environment:
  # 3.10 floor: dot shorthands and friends. CI tracks channel:stable, so
  # no pin to update there.
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  super_clipboard: ^0.9.1
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  url_launcher: ^6.3.2
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/tray/
    - assets/branding/logo.png