name: sclip
description: "Offline, RAM-only clipboard manager for macOS and Windows."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3
  tray_manager: ^0.8.0
  path_provider: ^2.1.6
  hotkey_manager: ^0.2.3
  window_manager: ^0.5.2
  super_clipboard: ^0.9.1
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/tray/
    - assets/branding/logo.png