name: CI

on:
  push:
    branches: [main, test, "v*"]
  pull_request:
    branches: [main, test, "v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Swift)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Package needs Swift 6 tools; pick the newest non-beta Xcode on the image.
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          if [ -n "$XCODE" ]; then
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE"
          else
            echo "No versioned Xcode found; keeping image default"
          fi
          xcodebuild -version
          swift --version

      - name: Verify
        run: bash scripts/verify.sh

  windows:
    name: Windows (C++)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1
