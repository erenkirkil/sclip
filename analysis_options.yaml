# Static analysis configuration. Baseline is flutter_lints; the additions
# below tighten async hygiene (silently discarded futures were the main
# gap — failed prefs writes and tray callbacks vanished without a trace)
# and turn on the strict analyzer modes.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Async hygiene — every fire-and-forget future must be explicit
    # (unawaited(...)) or handled; errors in bare calls are silent.
    - unawaited_futures
    - discarded_futures
    # Immutability & typing polish.
    - prefer_final_locals
    - prefer_final_in_for_each
    - avoid_dynamic_calls
    - always_declare_return_types
    - cast_nullable_to_non_nullable
    - unnecessary_null_checks
    - throw_in_finally
    - avoid_slow_async_io
